apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inference-worker
  template:
    metadata:
      labels:
        app: inference-worker
    spec:
      nodeSelector:
        workload: gpu
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
      initContainers:
        - name: download-models
          image: 632100838024.dkr.ecr.us-east-1.amazonaws.com/lchai-prod/inference-service:latest
          command:
            - python3
            - -c
            - |
              import boto3, os
              s3 = boto3.client('s3', region_name='us-east-1')
              os.makedirs('/data/models', exist_ok=True)
              os.makedirs('/data/checkpoints', exist_ok=True)
              for obj in s3.list_objects_v2(Bucket='lchai-prod-models', Prefix='backbones/').get('Contents', []):
                  key = obj['Key']
                  name = key.split('/')[-1]
                  if name.endswith('.pth') and '_backup' not in key:
                      print(f'Downloading {key}...')
                      s3.download_file('lchai-prod-models', key, f'/data/models/{name}')
              for obj in s3.list_objects_v2(Bucket='lchai-prod-models', Prefix='checkpoints/').get('Contents', []):
                  key = obj['Key']
                  name = key.split('/')[-1]
                  if name.endswith('.pth'):
                      print(f'Downloading {key}...')
                      s3.download_file('lchai-prod-models', key, f'/data/checkpoints/{name}')
              print('Model download complete')
          volumeMounts:
            - name: model-data
              mountPath: /data
          envFrom:
            - configMapRef:
                name: lchai-config
            - secretRef:
                name: lchai-secrets
      containers:
        - name: inference-worker
          image: 632100838024.dkr.ecr.us-east-1.amazonaws.com/lchai-prod/inference-service:latest
          command: ["celery", "-A", "app.celery_app:celery", "worker", "--loglevel=info", "--concurrency=1"]
          env:
            - name: CTRANSPATH_CHECKPOINT
              value: "/data/models/ctranspath.pth"
            - name: FUZZYARC_CHECKPOINT
              value: "/data/models/best_fuzzyarcloss_v2.pth"
            - name: V2_CHECKPOINT_DIR
              value: "/data/checkpoints"
          envFrom:
            - configMapRef:
                name: lchai-config
            - secretRef:
                name: lchai-secrets
          volumeMounts:
            - name: model-data
              mountPath: /data
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "4"
              memory: 8Gi
              nvidia.com/gpu: "1"
      volumes:
        - name: model-data
          emptyDir:
            sizeLimit: 10Gi
