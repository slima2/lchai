apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate-{{ now | date "20060102-150405" }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-1"
    helm.sh/hook-delete-policy: hook-succeeded
spec:
  backoffLimit: 3
  template:
    spec:
      nodeSelector:
        workload: general
      restartPolicy: OnFailure
      containers:
        {{- $migrationServices := list "case-service" "image-service" "inference-service" "ehr-service" "graph-service" "ontology-admin-service" "audit-service" }}
        {{- range $i, $svc := $migrationServices }}
        - name: migrate-{{ $svc }}
          image: {{ $.Values.image.registry }}/{{ $.Values.image.prefix }}/{{ $svc }}:{{ $.Values.image.tag }}
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: lchai-config
            - secretRef:
                name: lchai-secrets
        {{- end }}
