apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inference-worker
  template:
    metadata:
      labels:
        app: inference-worker
    spec:
      nodeSelector:
        workload: gpu
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
      initContainers:
        - name: download-models
          image: amazon/aws-cli:latest
          command: ["sh", "-c"]
          args:
            - |
              aws s3 sync s3://{{ .Values.s3.modelsBucket }}/backbones/ /data/models/ &&
              aws s3 sync s3://{{ .Values.s3.modelsBucket }}/checkpoints/ /data/checkpoints/
          volumeMounts:
            - name: models
              mountPath: /data/models
            - name: checkpoints
              mountPath: /data/checkpoints
      containers:
        - name: inference-worker
          image: {{ .Values.image.registry }}/{{ .Values.image.prefix }}/inference-service:{{ .Values.image.tag }}
          command: ["celery", "-A", "app.celery_app:celery", "worker", "--loglevel=info", "--concurrency=1"]
          envFrom:
            - configMapRef:
                name: lchai-config
            - secretRef:
                name: lchai-secrets
          env:
            - name: CTRANSPATH_CHECKPOINT
              value: "/data/models/ctranspath.pth"
            - name: FUZZYARC_CHECKPOINT
              value: "/data/models/best_fuzzyarcloss_v2.pth"
            - name: V2_CHECKPOINT_DIR
              value: "/data/checkpoints"
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "4"
              memory: 8Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: models
              mountPath: /data/models
            - name: checkpoints
              mountPath: /data/checkpoints
      volumes:
        - name: models
          emptyDir: {}
        - name: checkpoints
          emptyDir: {}
