apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inference-worker
  template:
    metadata:
      labels:
        app: inference-worker
    spec:
      nodeSelector:
        workload: gpu
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: inference-worker
          image: {{ .Values.image.registry }}/{{ .Values.image.prefix }}/inference-service:{{ .Values.image.tag }}
          command: ["sh", "-c"]
          args:
            - |
              python3 -c "
              import boto3, os
              s3 = boto3.client('s3', region_name='us-east-1')
              bucket = '{{ .Values.s3.modelsBucket }}'
              for prefix, dest in [('backbones/', '/data/models/'), ('checkpoints/', '/data/checkpoints/')]:
                  os.makedirs(dest, exist_ok=True)
                  resp = s3.list_objects_v2(Bucket=bucket, Prefix=prefix)
                  for obj in resp.get('Contents', []):
                      key = obj['Key']
                      fname = key.split('/')[-1]
                      if fname:
                          local = dest + fname
                          if not os.path.exists(local):
                              print(f'Downloading {key} -> {local}')
                              s3.download_file(bucket, key, local)
              print('Models ready!')
              " &&
              celery -A app.celery_app:celery worker --loglevel=info --concurrency=1
          envFrom:
            - configMapRef:
                name: lchai-config
            - secretRef:
                name: lchai-secrets
          env:
            - name: CTRANSPATH_CHECKPOINT
              value: "/data/models/ctranspath.pth"
            - name: FUZZYARC_CHECKPOINT
              value: "/data/models/best_fuzzyarcloss_v2.pth"
            - name: V2_CHECKPOINT_DIR
              value: "/data/checkpoints"
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "4"
              memory: 8Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: models
              mountPath: /data/models
            - name: checkpoints
              mountPath: /data/checkpoints
      volumes:
        - name: models
          emptyDir: {}
        - name: checkpoints
          emptyDir: {}
