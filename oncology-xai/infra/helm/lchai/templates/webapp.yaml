apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp
spec:
  replicas: {{ .Values.services.webapp.replicas }}
  selector:
    matchLabels:
      app: webapp
  template:
    metadata:
      labels:
        app: webapp
    spec:
      nodeSelector:
        workload: general
      containers:
        - name: webapp
          image: {{ .Values.image.registry }}/{{ .Values.image.prefix }}/webapp:{{ .Values.image.tag }}
          ports:
            - containerPort: 3000
          env:
            - name: VITE_API_URL
              value: "https://{{ .Values.domain }}"
            - name: VITE_KEYCLOAK_URL
              value: "https://{{ .Values.domain }}"
            - name: VITE_KEYCLOAK_REALM
              value: "oncology"
            - name: VITE_KEYCLOAK_CLIENT_ID
              value: "oncology-webapp"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: webapp
spec:
  selector:
    app: webapp
  ports:
    - port: 3000
      targetPort: 3000
