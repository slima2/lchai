apiVersion: v1
kind: Secret
metadata:
  name: lchai-secrets
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ required "postgres password" .Values.postgres.password | quote }}
  OPENAI_API_KEY: {{ .Values.openaiApiKey | default "" | quote }}
  S3_ACCESS_KEY: {{ .Values.s3.accessKey | default "" | quote }}
  S3_SECRET_KEY: {{ .Values.s3.secretKey | default "" | quote }}
